<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foco</title>

  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <section class="card">

      <h1>Foco 30</h1>

      <form id="taskForm">
        <label for="taskInput">
          Qual tarefa você quer realizar?
        </label>

        <div class="input-area">
          <input
            id="taskInput"
            type="text"
            placeholder="Ex: Estudar JavaScript"
            maxlength="120"
            required
          >

          <button type="submit">
            Começar
          </button>
        </div>
      </form>

      <section id="focusSection" class="hidden">

        <p class="label">Tarefa atual</p>

        <h2 id="taskDisplay"></h2>

        <div id="timer">
          30:00
        </div>

        <p id="status">
          Período de foco em andamento.
        </p>

        <button id="restartButton" type="button">
          Iniciar novamente
        </button>

      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
